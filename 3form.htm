<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
 <link rel="stylesheet" href="style.css"> 
    <style>
           
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container{
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
            color: #333;
        }

        label{
            font-weight: bold;
        }

       input, textarea, select{
    width: 100%;
    padding: 12px;          /* Increased padding */
    font-size: 16px;        /* Bigger text */
    margin-top: 5px;
    margin-bottom: 15px;
    border: 2px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box; /* Keeps proper size */
}
            
        

        .gender,
        .hobbies{
            margin-bottom: 15px;
        }

        .gender input,
        .hobbies input{
            width: auto;
        }

        #btn{
            width: 100%;
           
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #btn:hover{
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">
    <marquee>welcome to our registration form</marquee>
        <h2>Registration Form   
                       </h2>
                       <iframe src="file:///C:/Users/Divya/OneDrive/Desktop/java/html/modal1/3form.htm" width="100%" height="270" frameBorder="0" class="giphy-embed" allowFullScreen></iframe><br><br>
                        <img src="istockphoto-1727817280-612x612.jpg " style="width:100%; border-radius: 10px; margin-bottom: 20px; ">
       
        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="enter your password" required>
             <a href="https://github.com/divya058-sudo/2402030400001_model1"> visit GitHub</a><br><br>
            <label for="contact">Contact Number:</label>
            <input type="tel" id="contact" name="contact" placeholder="enter your contact number" required>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4"  placeholder="Enter your address"></textarea>

            <label for="state">State:</label>
            <select id="state" name="state">
                <option>Gujarat</option>
                <option>Maharashtra</option>
                <option>Rajasthan</option>
                <option>Madhya Pradesh</option>
                <option>Uttar Pradesh</option>
            </select>

            <div class="gender">
                <label>Gender:</label><br>

                <input type="radio" id="male" name="gender">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender">
                <label for="other">Other</label>
            </div>

            <div class="hobbies">
                <label>Hobbies:</label><br>

                <input type="checkbox" id="reading">
                <label for="reading">Reading</label><br>

                <input type="checkbox" id="traveling">
                <label for="traveling">Traveling</label><br>

                <input type="checkbox" id="cooking">
                <label for="cooking">Cooking</label><br>

                <input type="checkbox" id="sports">
                <label for="sports">Sports</label>
            </div>

            <input type="submit" value="Submit" id="btn">

        </form>
 <audio controls autoplay loop>

        <video controls width="100" height="100"><source src="348116_medium.mp4" type="video/mp4">
    </video>
    </div>
   
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Talent Hunt Gallery</title>

<style>
    /* ================= SAFE RESPONSIVE ================= */

@media(max-width:768px){

    nav{

        flex-direction:column;

        gap:15px;

        padding:15px;
    }

    nav ul{

        flex-wrap:wrap;

        justify-content:center;

        gap:12px;
    }

    .hero h1{

        font-size:38px;
    }

    .hero p{

        font-size:18px;
    }

    .section-title{

        font-size:32px;
    }

    .gallery{

        width:95%;
    }

    .gallery-card video{

        height:220px;
    }

    .reaction-box{

        flex-wrap:wrap;
    }

}

@media(max-width:480px){

    .hero h1{

        font-size:30px;
    }

    .hero p{

        font-size:16px;
    }

    .logo{

        font-size:22px;
    }

}
    .bonus-line{

    margin-top:15px;

    color:hotpink;

    font-size:20px;

    font-weight:bold;
}

/* ===== YOUR ORIGINAL CSS (UNCHANGED) ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

/* Navbar */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:black;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:28px;
    color:gold;
    font-weight:bold;
}

nav ul{
    display:flex;
    gap:25px;
    list-style:none;
}

nav ul li a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

nav ul li a:hover{
    color:hotpink;
}

/* Hero */
.hero{
    height:60vh;
    background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.8)),
    url("https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:60px;
    color:gold;
}

.hero p{
    margin-top:15px;
    font-size:22px;
}

/* Section */
.section-title{
    text-align:center;
    margin:70px 0 40px;
    font-size:42px;
    color:gold;
}

/* Gallery */
.gallery{
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.gallery-card{
    background:#1a1a1a;
    border-radius:18px;
    overflow:hidden;
    transition:0.3s;
}

.gallery-card:hover{
    transform:translateY(-8px);
    box-shadow:0px 0px 20px hotpink;
}

.gallery-card video{
    width:100%;
    height:300px;
    object-fit:cover;
    background:black;
}

.audio-box{
    text-align:center;
    padding:40px;
}

.audio-box img{
    width:120px;
}

.audio-box audio{
    width:100%;
    margin-top:20px;
}

/* Overlay */
.overlay{
    padding:20px;
}

.overlay h3{
    color:hotpink;
    margin-bottom:8px;
}

.overlay p{
    color:#ddd;
}

/* Buttons */
.reaction-box{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.reaction-box button{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    background:rgba(255,255,255,0.12);
    color:white;
    transition:0.3s;
}

.reaction-box button:hover{
    background:hotpink;
}

/* Comment */
.comment-section{
    margin-top:15px;
}

.comment-input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;
    outline:none;
}

.post-btn{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:gold;
    color:black;
    cursor:pointer;
    font-weight:bold;
}

.comment-list{
    list-style:none;
    margin-top:12px;
}

.comment-list li{
    background:rgba(255,255,255,0.1);
    padding:8px;
    border-radius:8px;
    margin-top:8px;
}

/* Footer */
footer{
    background:black;
    text-align:center;
    padding:30px;
    margin-top:70px;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">Performous</div>
<ul>
<li><a href="home.htm">Home</a></li>
<li><a href="gallery.html">Gallery</a></li>
<li><a href="login.html">Login</a></li>
<li><a href="dynamicform.html">Apply Now</a></li>
</ul>
</nav>

<!-- HERO -->
<section class="hero">
<div>
<h1>Performance Gallery</h1>
<p>Watch amazing talent performances</p>
</div>

</section>

<!-- TITLE -->
<h1 class="section-title">Participant Performances</h1>
<p class="bonus-line">
🔥 Quiz Winners Can Give Multiple Likes
</p>

<section class="gallery" id="galleryContainer"></section>

<!-- FOOTER -->
<footer>
<p>© 2026 Talent Hunt Show | All Rights Reserved</p>
</footer>

<!-- SCRIPT -->
<script>

const gallery =
document.getElementById("galleryContainer");

const participants =
JSON.parse(localStorage.getItem("participants")) || [];

// SHOW ALL
participants.forEach(function(item, index){

    if(!item.likes) item.likes = 0;
    if(!item.views) item.views = 0;

    item.views++;

    localStorage.setItem("participants", JSON.stringify(participants));

    let mediaContent = "";

    if(item.video){

        mediaContent = `
        <video controls>
            <source src="${item.video}" type="video/mp4">
        </video>
        `;

    } else if(item.audio){

        mediaContent = `
        <div class="audio-box">

            <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" width="120">

            <audio controls style="width:100%;">
                <source src="${item.audio}" type="audio/mp3">
            </audio>

        </div>
        `;
    }

    gallery.innerHTML += `
    <div class="gallery-card">

        ${mediaContent}

        <div class="overlay">

            <h3>${item.name}</h3>
            <p>${item.category} Performance</p>

            <div class="reaction-box">

                <button class="like-btn" data-index="${index}">
                    ❤️ Like <span>${item.likes}</span>
                </button>

                <button>
                    👁 ${item.views} Views
                </button>
                <button class="delete-btn" data-index="${index}">
               🗑 Delete
                </button>

            </div>

            <div class="comment-section">

                <input type="text" placeholder="Write comment..." class="comment-input">

                <button class="post-btn">Post</button>

                <ul class="comment-list"></ul>

            </div>

        </div>

    </div>
    `;

});
console.log(
localStorage.getItem("superLikes")
);

// LIKE SYSTEM
/* LIKE SYSTEM */

document.addEventListener("click", function(e){

    if(e.target.closest(".like-btn")){

        let btn =
        e.target.closest(".like-btn");

        let index =
        btn.getAttribute("data-index");

        /* GET BONUS SCORE */

        let superLikes =
        parseInt(
        localStorage.getItem("superLikes")
        );

        /* CHECK BONUS USED */

        let bonusUsed =
        localStorage.getItem("bonusUsed");

        /* FIRST TIME BONUS */

        if(!bonusUsed && !isNaN(superLikes)){

            participants[index].likes += superLikes;

            localStorage.setItem(
                "bonusUsed",
                "true"
            );

            alert(
                "🔥 Quiz Bonus +" +
                superLikes +
                " Likes"
            );

        }

        /* NORMAL LIKE */

        else{

            participants[index].likes++;

            alert("❤️ +1 Like");

        }

        /* SAVE */

        localStorage.setItem(
            "participants",
            JSON.stringify(participants)
        );

        /* UPDATE */

        btn.querySelector("span").innerText =
        participants[index].likes;

    }

});
// COMMENT SYSTEM
document.addEventListener("click", function(e){

    if(e.target.classList.contains("post-btn")){

        const parent = e.target.parentElement;
        const input = parent.querySelector(".comment-input");
        const list = parent.querySelector(".comment-list");

        if(input.value.trim() !== ""){

            const li = document.createElement("li");
            li.innerText = input.value;

            list.appendChild(li);
            input.value = "";
        }
    }

});
/* DELETE SYSTEM */

document.addEventListener("click", function(e){

    if(e.target.closest(".delete-btn")){

        let index =
        e.target.closest(".delete-btn")
        .getAttribute("data-index");

        let confirmDelete =
        confirm(
            "Delete this performance?"
        );

        if(confirmDelete){

            participants.splice(index,1);

            localStorage.setItem(
                "participants",
                JSON.stringify(participants)
            );

            location.reload();

        }

    }

});

</script>

</body>
</html>

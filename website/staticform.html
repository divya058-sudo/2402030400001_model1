<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Competition Registration</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#fbc2eb);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.container{
    width: 100%;
    max-width: 750px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0px 8px 25px rgba(0,0,0,0.2);
    animation: fadeIn 1s ease;
}

h1{
    text-align: center;
    color: #ff4081;
    margin-bottom: 10px;
}

.subtitle{
    text-align: center;
    margin-bottom: 25px;
    color: gray;
}

form{
    display: grid;
    gap: 18px;
}

.input-group{
    display: flex;
    flex-direction: column;
}

label{
    margin-bottom: 7px;
    font-weight: bold;
    color: #444;
}

input,
select,
textarea{
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    outline: none;
    transition: 0.3s;
    font-size: 15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color: #ff4081;
    box-shadow: 0px 0px 8px rgba(255,64,129,0.4);
}

textarea{
    resize: none;
}

.row{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.file-box{
    border: 2px dashed #ff4081;
    padding: 15px;
    border-radius: 12px;
    background: #fff5f9;
    transition: 0.3s;
}

.file-box:hover{
    transform: scale(1.02);
}

button{
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg,#ff4081,#ff6ec7);
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
    font-weight: bold;
}

button:hover{
    transform: translateY(-3px);
    box-shadow: 0px 5px 15px rgba(255,64,129,0.4);
}

.footer{
    text-align: center;
    margin-top: 20px;
    color: gray;
    font-size: 14px;
}

@keyframes fadeIn{
    from{
        opacity: 0;
        transform: translateY(20px);
    }
    to{
        opacity: 1;
        transform: translateY(0px);
    }
}

@media(max-width:700px){

    .row{
        grid-template-columns: 1fr;
    }

}

</style>
</head>
<body>

<div class="container">

    <h1>🎤 Singing & Dancing Competition</h1>
    <p class="subtitle">
        Register now and showcase your talent!
    </p>

    <form>

        <div class="row">

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label>Age</label>
                <input type="number" placeholder="Enter age" required>
            </div>

        </div>

        <div class="row">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter email" required>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number" required>
            </div>

        </div>

        <div class="input-group">
            <label>Select Competition Category</label>

            <select required>
                <option value="">Choose category</option>
                <option>Singing</option>
                <option>Dancing</option>
                <option>Both Singing & Dancing</option>
            </select>
        </div>

        <div class="input-group">
            <label>Instagram Profile Link</label>
            <input type="url" placeholder="https://instagram.com/yourprofile">
        </div>

        <div class="file-box">

            <div class="input-group">
                <label>Upload Audio File</label>
                <input type="file" accept="audio/*">
            </div>

        </div>

        <div class="file-box">

            <div class="input-group">
                <label>Upload Video File</label>
                <input type="file" accept="video/*">
            </div>

        </div>

        <div class="input-group">
            <label>Why do you want to participate?</label>

            <textarea rows="5" placeholder="Write something about your talent..."></textarea>
        </div>

        <button type="submit">
            Submit Registration
        </button>

    </form>

    <div class="footer">
        © 2026 Talent Competition | All Rights Reserved
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Talent Battle Quiz</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.8)),
    url("https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1400&auto=format&fit=crop");

    background-size:cover;
    background-position:center;

    position:relative;
}

/* GLOW EFFECT */

body::before{

    content:"";

    position:absolute;

    width:450px;
    height:450px;

    background:hotpink;

    filter:blur(170px);

    top:-120px;
    left:-120px;

    opacity:0.4;
}

body::after{

    content:"";

    position:absolute;

    width:400px;
    height:400px;

    background:gold;

    filter:blur(180px);

    bottom:-100px;
    right:-100px;

    opacity:0.3;
}

/* FLOATING CIRCLES */

.circle{

    position:absolute;

    border-radius:50%;

    background:rgba(255,255,255,0.07);

    animation:float 8s linear infinite;
}

.circle1{
    width:90px;
    height:90px;
    top:10%;
    left:15%;
}

.circle2{
    width:60px;
    height:60px;
    bottom:15%;
    left:8%;
    animation-duration:12s;
}

.circle3{
    width:120px;
    height:120px;
    top:18%;
    right:12%;
    animation-duration:10s;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-25px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* QUIZ CARD */

.quiz-card{

    position:relative;

    z-index:5;

    width:90%;
    max-width:850px;

    padding:40px;

    border-radius:30px;

    backdrop-filter:blur(18px);

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.12);

    box-shadow:
    0px 0px 40px rgba(255,20,147,0.25);
}

/* TOP */

.top{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:35px;
}

.logo{

    font-size:36px;
    font-weight:700;

    color:white;
}

.score{

    padding:12px 20px;

    border-radius:15px;

    background:rgba(255,255,255,0.1);

    color:gold;

    font-weight:600;
}

/* PROGRESS BAR */

.progress-box{

    width:100%;
    height:10px;

    background:rgba(255,255,255,0.1);

    border-radius:20px;

    overflow:hidden;

    margin-bottom:30px;
}

.progress{

    width:0%;

    height:100%;

    background:
    linear-gradient(90deg,hotpink,gold);

    transition:0.4s;
}

/* QUESTION */

.question-number{

    color:hotpink;

    margin-bottom:12px;

    font-size:18px;
}

.question{

    color:white;

    font-size:36px;

    font-weight:600;

    line-height:1.4;

    margin-bottom:30px;
}

/* OPTIONS */

.options{

    display:grid;

    gap:18px;
}

.option{

    padding:20px;

    border-radius:18px;

    cursor:pointer;

    font-size:18px;

    color:white;

    font-weight:500;

    border:2px solid transparent;

    background:rgba(255,255,255,0.07);

    transition:0.3s;
}

.option:hover{

    transform:translateX(10px);

    border-color:hotpink;

    background:rgba(255,20,147,0.18);
}

.correct{

    background:rgba(0,255,120,0.25)!important;

    border-color:#00ff88!important;
}

.wrong{

    background:rgba(255,0,70,0.25)!important;

    border-color:#ff004c!important;
}

/* BUTTON */

#nextBtn{

    width:100%;

    margin-top:30px;

    padding:18px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    font-size:20px;

    font-weight:600;

    color:white;

    background:
    linear-gradient(45deg,hotpink,purple);

    display:none;

    transition:0.3s;
}

#nextBtn:hover{

    transform:scale(1.02);
}

/* RESULT */

.result{

    display:none;

    text-align:center;
}

.result h1{

    font-size:60px;

    color:gold;

    margin-bottom:20px;
}

.result p{

    color:white;

    font-size:28px;

    margin-bottom:30px;
}

#restartBtn{

    padding:18px 35px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    font-size:20px;

    font-weight:600;

    background:
    linear-gradient(45deg,gold,orange);
}

/* MOBILE */

@media(max-width:768px){

    .quiz-card{
        padding:25px;
    }

    .top{
        flex-direction:column;
        gap:20px;
    }

    .logo{
        font-size:28px;
    }

    .question{
        font-size:26px;
    }

    .option{
        font-size:16px;
        padding:16px;
    }

}

</style>
</head>

<body>

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

<div class="quiz-card">

<div id="quizBox">

<div class="top">

<div class="logo">
🎤 Talent Quiz
</div>

<div class="score">
⭐ Score :
<span id="liveScore">0</span>
</div>

</div>

<div class="progress-box">
<div class="progress" id="progressBar"></div>
</div>

<div class="question-number" id="qNo">
Question 1 / 5
</div>

<div class="question" id="question">
Question Here
</div>

<div class="options">

<div class="option"></div>
<div class="option"></div>
<div class="option"></div>
<div class="option"></div>

</div>

<button id="nextBtn">
Next Question →
</button>

</div>

<div class="result" id="resultBox">

<h1>🏆 Finished!</h1>

<p id="finalScore"></p>

<button id="restartBtn">
Play Again
</button>

</div>

</div>

<script>

const quiz = [

{
question:"Which dance style is famous in street culture?",
options:["Breakdance","Kathak","Ballet","Garba"],
answer:"Breakdance"
},

{
question:"Which instrument has piano keys?",
options:["Violin","Piano","Drum","Tabla"],
answer:"Piano"
},

{
question:"Which Indian dance is famous in Gujarat?",
options:["Garba","Kathakali","Salsa","Ballet"],
answer:"Garba"
},

{
question:"What is mainly used for singing?",
options:["Helmet","Microphone","Speaker","Brush"],
answer:"Microphone"
},

{
question:"Who performs songs on stage?",
options:["Singer","Driver","Doctor","Teacher"],
answer:"Singer"
}

];

let current = 0;
let score = 0;

loadQuestion();

function loadQuestion(){

    $("#nextBtn").hide();

    $(".option").removeClass("correct wrong answered");

    $("#qNo").text(
        "Question " + (current + 1) + " / " + quiz.length
    );

    $("#question").text(
        quiz[current].question
    );

    $(".option").each(function(index){

        $(this).text(
            quiz[current].options[index]
        );

    });

    let progress =
    ((current) / quiz.length) * 100;

    $("#progressBar").css("width", progress + "%");
}

/* OPTION CLICK */

$(".option").click(function(){

    if($(this).hasClass("answered")){
        return;
    }

    $(".option").addClass("answered");

    let selected = $(this).text();

    let answer = quiz[current].answer;

    if(selected === answer){

        $(this).addClass("correct");

        score++;

        $("#liveScore").text(score);

    }
    else{

        $(this).addClass("wrong");

        $(".option").each(function(){

            if($(this).text() === answer){

                $(this).addClass("correct");

            }

        });

    }

    $("#nextBtn").fadeIn();

});

/* NEXT BUTTON */

/* NEXT BUTTON */

$("#nextBtn").click(function(){

    current++;

    if(current < quiz.length){

        loadQuestion();

    }
    else{

        $("#progressBar").css("width","100%");

        $("#quizBox").hide();

        $("#resultBox").fadeIn();

        $("#finalScore").text(
            "You scored " +
            score +
            " out of " +
            quiz.length
        );

        /* SAVE SCORE FOR GALLERY LIKES */

        localStorage.setItem(
            "superLikes",
            score
        );

        console.log(
            "Saved Likes:",
            localStorage.getItem("superLikes")
        );

    }

});

/* RESTART */

$("#restartBtn").click(function(){

    current = 0;

    score = 0;

    $("#liveScore").text(score);

    $("#resultBox").hide();

    $("#quizBox").fadeIn();

    loadQuestion();

});

</script>

</body>
</html>

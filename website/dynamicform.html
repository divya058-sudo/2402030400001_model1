<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Talent Competition Registration</title>
<link rel="stylesheet" href="navbar.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
}

/* ================= NAVBAR ================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#222;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
}



/* ================= CONTAINER ================= */

.container{
    width:100%;
    max-width:750px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0px 8px 25px rgba(0,0,0,0.2);
    margin-top:90px;
}

h1{
    text-align:center;
    color:#ff4081;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:gray;
    margin-bottom:25px;
}

form{
    display:grid;
    gap:18px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

label{
    font-weight:bold;
    margin-bottom:7px;
    color:#444;
}

input,
select,
textarea{
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    transition:0.3s;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#ff4081;
    box-shadow:0px 0px 8px rgba(255,64,129,0.4);
}

textarea{
    resize:none;
}

.file-box{
    border:2px dashed #ff4081;
    padding:15px;
    border-radius:12px;
    background:#fff7fb;
}

.preview{
    margin-top:15px;
}

audio,
video{
    width:100%;
    margin-top:10px;
    border-radius:10px;
}

button{
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#ff4081,#ff6ec7);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
}

.error{
    color:red;
    font-size:14px;
    margin-top:5px;
}

/* ================= FOOTER ================= */

footer{
    background: black;
    width:100%;
    text-align:center;
    margin:70px;
    margin-left: 0px;
    margin-right: 0px;
    padding:20px 20px 20px 20px;
    color:white;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

    .row{
        grid-template-columns:1fr;
    }

    nav{
        flex-direction:column;
        gap:10px;
    }

}
/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    body{

        padding:15px;
    }

    /* NAVBAR */

    nav{

        flex-direction:column;

        gap:15px;

        padding:15px;
    }

    nav ul{

        flex-wrap:wrap;

        justify-content:center;

        gap:12px;
    }

    /* FORM CONTAINER */

    .container{

        width:100%;

        padding:25px 18px;

        margin-top:100px;
    }

    /* ROWS */

    .row{

        grid-template-columns:1fr;
    }

    /* HEADINGS */

    h1{

        font-size:28px;
    }

    .subtitle{

        font-size:15px;
    }

    /* INPUTS */

    input,
    select,
    textarea{

        font-size:14px;
    }

    /* VIDEO */

    video{

        height:auto;
    }

    /* BUTTON */

    button{

        width:100%;
    }

    footer{

        font-size:14px;

        padding:18px;
    }

}

/* SMALL MOBILE */

@media(max-width:480px){

    .container{

        padding:20px 15px;
    }

    h1{

        font-size:24px;
    }

    .logo{

        font-size:22px;
    }

    nav ul li a{

        font-size:14px;
    }

}

</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav>

<div class="logo">
Performous
</div>

<ul>
<li><a href="home.htm">Home</a></li>
<li><a href="gallery.html">Gallery</a></li>
<li><a href="login.html">Login</a></li>
<li><a href="dynamicform.html">Apply Now</a></li>
</ul>

</nav>

<!-- ================= FORM ================= -->

<div class="container">

<h1>🎤 Singing & Dancing Competition</h1>

<p class="subtitle">
Register & Show Your Talent
</p>

<form id="competitionForm">

<div class="row">

<div class="input-group">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Enter full name"
required
>

<div class="error" id="nameError"></div>

</div>

<div class="input-group">

<label>Age</label>

<input
type="number"
id="age"
placeholder="Enter age"
required
>

<div class="error" id="ageError"></div>

</div>

</div>

<div class="row">

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter email"
required
>

<div class="error" id="emailError"></div>

</div>

<div class="input-group">

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="Enter mobile number"
required
>

<div class="error" id="phoneError"></div>

</div>

</div>

<!-- CATEGORY -->

<div class="input-group">

<label>Competition Category</label>

<select id="category" required>

<option value="">Select Category</option>

<option>Singing</option>

<option>Dancing</option>

<option>Both</option>

</select>

</div>

<!-- FEES -->

<div class="input-group">

<label>Registration Fees</label>

<input
type="text"
id="fees"
readonly
placeholder="Select category first"
>

</div>
<!-- PAYMENT METHOD -->

<div class="input-group">

<label>Select Payment Method</label>

<select id="paymentMethod" required>

<option value="">
Choose Payment Method
</option>

<option>UPI</option>

<option>Credit Card</option>

<option>Debit Card</option>

<option>Net Banking</option>

<option>Cash On Audition</option>

</select>

</div>

<!-- PAYMENT DETAILS -->

<div class="input-group">

<label>Payment Details</label>

<input
type="text"
id="paymentDetails"
placeholder="Enter UPI ID or Card Number"
>

</div>

<!-- INSTAGRAM -->

<div class="input-group">

<label>Instagram Profile Link</label>

<input
type="url"
id="instagram"
placeholder="https://instagram.com/username"
required
>

<div class="error" id="instaError"></div>

</div>

<!-- AUDIO -->

<div class="file-box">

<div class="input-group">

<label>Upload Audio File</label>

<input
type="file"
id="audioFile"
accept=".mp3,.wav,.ogg"
>

<div class="error" id="audioError"></div>

</div>

<div class="preview">

<audio id="audioPreview" controls></audio>

</div>

</div>

<!-- VIDEO -->

<div class="file-box">

<div class="input-group">

<label>Upload Video File</label>

<input
type="file"
id="videoFile"
accept=".mp4,.webm,.mov"
>

<div class="error" id="videoError"></div>

</div>

<div class="preview">

<video
id="videoPreview"
controls
height="250"
></video>

</div>

</div>

<!-- ABOUT -->

<div class="input-group">

<label>About Your Talent</label>

<textarea
rows="5"
id="talent"
placeholder="Tell us about your talent..."
></textarea>

</div>


<!-- BUTTON -->

<button type="submit">

Submit Registration

</button>

<p style="text-align:center; margin-top:20px;">

Already have account?

<a href="login.html" style="color:#ff4081;">

Login Here

</a>

</p>

</form>

</div>

<!-- ================= FOOTER ================= -->

<footer>

<p>
© 2026 Talent Hunt Show | All Rights Reserved
</p>

</footer>

<!-- ================= JAVASCRIPT ================= -->

<script>

// CATEGORY FEES

const categorySelect =
document.getElementById("category");

const fees =
document.getElementById("fees");

categorySelect.addEventListener("change", function(){

    if(categorySelect.value === "Singing"){

        fees.value = "₹300";

    }
    else if(categorySelect.value === "Dancing"){

        fees.value = "₹400";

    }
    else if(categorySelect.value === "Both"){

        fees.value = "₹600";

    }
    else{

        fees.value = "";

    }

});
// PAYMENT METHOD

const paymentMethod =
document.getElementById("paymentMethod");

const paymentDetails =
document.getElementById("paymentDetails");

paymentMethod.addEventListener("change", function(){

    if(paymentMethod.value === "UPI"){

        paymentDetails.placeholder =
        "Enter UPI ID";

    }

    else if(
        paymentMethod.value === "Credit Card" ||
        paymentMethod.value === "Debit Card"
    ){

        paymentDetails.placeholder =
        "Enter Card Number";

    }

    else if(paymentMethod.value === "Net Banking"){

        paymentDetails.placeholder =
        "Enter Bank Name";

    }

    else if(paymentMethod.value === "Cash On Audition"){

        paymentDetails.placeholder =
        "Pay during audition day";

    }

    else{

        paymentDetails.placeholder =
        "Enter Payment Details";

    }

});

// NAME VALIDATION

const nameInput =
document.getElementById("name");

const nameError =
document.getElementById("nameError");

nameInput.addEventListener("input", function(){

    const namePattern =
    /^[A-Za-z ]{3,30}$/;

    if(!namePattern.test(nameInput.value)){

        nameError.innerText =
        "Only letters allowed";

    }
    else{

        nameError.innerText = "";

    }

});

// AGE VALIDATION

const ageInput =
document.getElementById("age");

const ageError =
document.getElementById("ageError");

ageInput.addEventListener("input", function(){

    if(ageInput.value < 5 ||
       ageInput.value > 60){

        ageError.innerText =
        "Age must be between 5 and 60";

    }
    else{

        ageError.innerText = "";

    }

});

// EMAIL VALIDATION

const emailInput =
document.getElementById("email");

const emailError =
document.getElementById("emailError");

emailInput.addEventListener("input", function(){

    const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailPattern.test(emailInput.value)){

        emailError.innerText =
        "Invalid Email";

    }
    else{

        emailError.innerText = "";

    }

});

// PHONE VALIDATION

const phoneInput =
document.getElementById("phone");

const phoneError =
document.getElementById("phoneError");

phoneInput.addEventListener("input", function(){

    const phonePattern =
    /^[6-9]\d{9}$/;

    if(!phonePattern.test(phoneInput.value)){

        phoneError.innerText =
        "Invalid Phone Number";

    }
    else{

        phoneError.innerText = "";

    }

});

// INSTAGRAM VALIDATION

const instagram =
document.getElementById("instagram");

const instaError =
document.getElementById("instaError");

instagram.addEventListener("input", function(){

    const instaPattern =
    /^https?:\/\/(www\.)?instagram\.com\/[A-Za-z0-9_.]+\/?$/;

    if(!instaPattern.test(instagram.value)){

        instaError.innerText =
        "Invalid Instagram Link";

    }
    else{

        instaError.innerText = "";

    }

});

// AUDIO PREVIEW

const audioFile =
document.getElementById("audioFile");

const audioPreview =
document.getElementById("audioPreview");

audioFile.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        audioPreview.src =
        URL.createObjectURL(file);

    }

});

// VIDEO PREVIEW

const videoFile =
document.getElementById("videoFile");

const videoPreview =
document.getElementById("videoPreview");

videoFile.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        videoPreview.src =
        URL.createObjectURL(file);

    }

});

// FORM SUBMIT



// FORM SUBMIT

const form =
document.getElementById("competitionForm");

form.addEventListener("submit", function(e){

    e.preventDefault();

    const participantName =
    document.getElementById("name").value;

    const participantCategory =
    document.getElementById("category").value;

    const audio =
    document.getElementById("audioFile").files[0];

    const video =
    document.getElementById("videoFile").files[0];

    // GET OLD PARTICIPANTS

    let participants =
    JSON.parse(
        localStorage.getItem("participants")
    ) || [];

    // AUDIO UPLOAD

    if(audio){

        if(audio.size > 1000000){

            alert(
            "Audio file must be below 1MB"
            );

            return;

        }

        const reader =
        new FileReader();

        reader.onload = function(event){

            const participant = {

                name: participantName,

                category: participantCategory,

                audio: event.target.result,

                video: null

            };

            participants.push(participant);

            localStorage.setItem(
                "participants",
                JSON.stringify(participants)
            );

            alert(
            "Audio Uploaded Successfully"
            );

            window.location.href =
            "gallery.html";

        };

        reader.readAsDataURL(audio);

    }

    // VIDEO UPLOAD

    else if(video){

        if(video.size > 3000000){

            alert(
            "Video file must be below 3MB"
            );

            return;

        }

        const reader2 =
        new FileReader();

        reader2.onload = function(event){

            const participant = {

                name: participantName,

                category: participantCategory,

                audio: null,

                video: event.target.result

            };

            participants.push(participant);

            localStorage.setItem(
                "participants",
                JSON.stringify(participants)
            );

            alert(
            "Video Uploaded Successfully"
            );

            window.location.href =
            "gallery.html";

        };

        reader2.readAsDataURL(video);

    }

    else{

        alert(
        "Please upload audio or video"
        );

    }

});

</script>


</body>
</html>
